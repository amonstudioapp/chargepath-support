name: Sync updates and publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: chargepath-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test release generation and synchronization
        run: python3 tests/run_coverage.py
      - name: Read the latest public App Store version
        if: github.event_name != 'push'
        run: python3 scripts/sync_app_store.py
      - name: Build version pages
        run: |
          python3 scripts/build_updates.py
          python3 scripts/build_updates.py --check
      - name: Save new release history
        run: |
          git add data/releases.json updates
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: sync ChargePath version updates'
            git push origin HEAD:main
          fi
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html privacy.html styles.css updates.css .nojekyll _site/
          cp -R assets updates _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
